name: Probe KB listing detail

on:
  push:
    branches: [main]
    paths:
      - '.github/probe-kb-listing-now'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe one KB listing target
        env:
          KB_AUTH_TOKEN: ${{ secrets.KB_AUTH_TOKEN }}
          KB_TRACE_ID: ${{ secrets.KB_TRACE_ID }}
          KB_COOKIE: ${{ secrets.KB_COOKIE }}
          KB_WMONID: ${{ secrets.KB_WMONID }}
          KB_DETAIL_NETWORK_ENABLED: '1'
        run: python3 scripts/collect_listings.py --complex-id 1947 --area-id 1835
