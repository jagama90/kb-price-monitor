name: Daily refresh completion guard

on:
  schedule:
    - cron: '20 0 * * *' # 09:20 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-refresh-completion-guard.yml'

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Complete daily data to Pages chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Seoul date +%F)"

          sync_main() {
            git fetch origin main
            git reset --hard origin/main
          }

          run_and_wait() {
            local wf="$1"; shift
            echo "Dispatching $wf $*"
            gh workflow run "$wf" "$@"
            sleep 4
            local run_id
            run_id="$(gh run list --workflow "$wf" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$run_id"
            echo "Waiting for $wf run $run_id"
            gh run watch "$run_id" --exit-status
          }

          dates() {
            python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          def load(path):
              p=Path(path)
              return json.loads(p.read_text()) if p.exists() else {}
          m=load('dist/market_indicators.json')
          r=load('data_sources/refresh_run_status.json')
          f=load('dist/regime_forecast.json')
          c=load('dist/upside_daily_candidate.json')
          h=load('dist/upside_probability_history.json')
          s=str(r.get('attempted_at') or '').replace('Z','+00:00')
          refresh=''
          try:
              d=datetime.datetime.fromisoformat(s)
              if d.tzinfo is None:d=d.replace(tzinfo=datetime.timezone.utc)
              refresh=d.astimezone(datetime.timezone(datetime.timedelta(hours=9))).date().isoformat()
          except Exception: pass
          research=(h.get('research_daily') or [])
          print('|'.join([
              str(m.get('updated_at') or ''),
              refresh,
              str(f.get('as_of') or ''),
              str((c.get('current') or {}).get('as_of') or ''),
              str((research[-1] if research else {}).get('date') or '')
          ]))
          PY
          }

          sync_main
          IFS='|' read -r data_date refresh_date forecast_date candidate_date history_date <<<"$(dates)"
          echo "today=$today data=$data_date refresh=$refresh_date forecast=$forecast_date candidate=$candidate_date history=$history_date"

          if [ "$data_date" != "$today" ] || [ "$refresh_date" != "$today" ]; then
            run_and_wait parallel-market-refresh.yml -f skip_preflight=true
            sync_main
          fi

          IFS='|' read -r data_date refresh_date forecast_date candidate_date history_date <<<"$(dates)"
          if [ "$forecast_date" != "$today" ] || [ "$candidate_date" != "$today" ] || [ "$history_date" != "$today" ]; then
            run_and_wait forecast-regime.yml
            sync_main
          fi

          run_and_wait system-health.yml
          sync_main
          run_and_wait pages.yml
          sync_main

          IFS='|' read -r data_date refresh_date forecast_date candidate_date history_date <<<"$(dates)"
          test "$data_date" = "$today"
          test "$refresh_date" = "$today"
          test "$forecast_date" = "$today"
          test "$candidate_date" = "$today"
          test "$history_date" = "$today"
          echo "Daily refresh complete end-to-end: data -> forecast -> health -> Pages."
