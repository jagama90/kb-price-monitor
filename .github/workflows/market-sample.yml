name: Validate market samples

# SAMPLE PATH: cheap collector validation. Never publishes or launches full refreshes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_public_market.py'
      - 'scripts/collect_molit_trades.py'
      - 'scripts/collect_kb_sentiment.py'
      - 'scripts/collect_watchlist_recent_trades.py'
      - 'scripts/collect_listings.py'
      - 'scripts/collect_catalog.py'
      - 'scripts/collect_types.py'
      - 'scripts/collect_seoul.py'
      - 'scripts/build_buy_watchlist_master.py'
      - 'data/buy_watchlist_targets.json'
      - '.github/workflows/parallel-market-refresh.yml'
      - '.github/workflows/weekly-refresh.yml'
      - '.github/workflows/market-extensions.yml'
      - '.github/workflows/forecast-regime.yml'
      - '.github/workflows/system-health.yml'
      - '.github/workflows/research-turning-signal.yml'
      - '.github/workflows/final-backtest.yml'
      - '.github/workflows/market-sample.yml'

permissions:
  contents: read

concurrency:
  group: market-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Actions YAML syntax
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          paths=[
            '.github/workflows/parallel-market-refresh.yml',
            '.github/workflows/weekly-refresh.yml',
            '.github/workflows/market-sample.yml',
            '.github/workflows/market-extensions.yml',
            '.github/workflows/forecast-regime.yml',
            '.github/workflows/system-health.yml',
            '.github/workflows/research-turning-signal.yml',
            '.github/workflows/final-backtest.yml',
            '.github/workflows/pages.yml',
          ]
          for p in paths:
              yaml.compose(Path(p).read_text(encoding='utf-8'))
              print('YAML OK',p)
          PY
      - name: Validate fast/full/sample trigger isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          heavy=[
            '.github/workflows/parallel-market-refresh.yml',
            '.github/workflows/weekly-refresh.yml',
            '.github/workflows/market-extensions.yml',
            '.github/workflows/forecast-regime.yml',
            '.github/workflows/system-health.yml',
            '.github/workflows/research-turning-signal.yml',
            '.github/workflows/final-backtest.yml',
          ]
          for p in heavy:
              data=yaml.load(Path(p).read_text(encoding='utf-8'),Loader=yaml.BaseLoader)
              triggers=data.get('on') or {}
              assert 'push' not in triggers, f'heavy workflow must not run on push: {p}'
          sample=yaml.load(Path('.github/workflows/market-sample.yml').read_text(encoding='utf-8'),Loader=yaml.BaseLoader)
          assert 'push' in (sample.get('on') or {}), 'sample path must validate relevant code pushes'
          daily=Path('.github/workflows/parallel-market-refresh.yml').read_text(encoding='utf-8')
          assert daily.count('continue-on-error: true') >= 4, 'daily source jobs must fail soft'
          assert daily.count('artifact_ready:') >= 4, 'daily source artifact gates missing'
          extensions=yaml.load(Path('.github/workflows/market-extensions.yml').read_text(encoding='utf-8'),Loader=yaml.BaseLoader)
          ext_names=((extensions.get('on') or {}).get('workflow_run') or {}).get('workflows') or []
          assert 'Parallel market data refresh' not in ext_names, 'daily path must not launch heavy market extensions'
          health=yaml.load(Path('.github/workflows/system-health.yml').read_text(encoding='utf-8'),Loader=yaml.BaseLoader)
          assert 'schedule' not in (health.get('on') or {}), 'health gate must not duplicate daily schedule'
          print('TRIGGER ISOLATION OK')
          PY
      - name: Syntax check collector path
        run: |
          python3 -m py_compile \
            scripts/collect_public_market.py \
            scripts/collect_molit_trades.py \
            scripts/collect_kb_sentiment.py \
            scripts/collect_watchlist_recent_trades.py \
            scripts/collect_listings.py \
            scripts/collect_catalog.py \
            scripts/collect_types.py \
            scripts/collect_seoul.py \
            scripts/build_buy_watchlist_master.py
      - name: Validate two live KB market samples
        run: |
          pip install playwright
          playwright install chromium
          python3 scripts/collect_public_market.py --sample
      - name: Validate exact-area lightweight collector
        env:
          KB_AUTH_TOKEN: ${{ secrets.KB_AUTH_TOKEN }}
          KB_TRACE_ID: ${{ secrets.KB_TRACE_ID }}
          KB_WMONID: ${{ secrets.KB_WMONID }}
        run: |
          python3 scripts/collect_listings.py --complex-id 1960
          python3 scripts/collect_listings.py --complex-id 1947 --area-id 1835
      - name: Preserve sample result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-sample-${{ github.run_id }}
          path: |
            data/market_sample_validation.json
            data/listing_asks_probe.json
          if-no-files-found: warn
