name: KB history endpoint probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_kb_history_endpoint.py'
      - '.github/workflows/kb-history-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe live KB web app
        run: python3 scripts/probe_kb_history_endpoint.py
      - name: Commit candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data_sources/kb_history_probe.json
          git commit -m 'Probe KB historical price endpoint' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kb-history-probe-${{ github.run_id }}
          path: data_sources/kb_history_probe.json
          if-no-files-found: warn
