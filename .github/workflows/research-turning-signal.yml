name: Research turning signal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_turning_signal.py'
      - 'dist/final_backtest.json'
      - 'scripts/collect_reb_long_cycle.py'
      - 'scripts/build_long_cycle_readiness.py'
      - 'scripts/build_long_cycle_master.py'
      - 'scripts/validate_long_cycle_inputs.py'
      - 'scripts/backtest_long_cycle_regimes.py'
      - 'scripts/evaluate_buy_opportunity.py'
      - 'scripts/validate_long_cycle_models.py'
      - 'scripts/validate_long_cycle_score.py'
      - 'scripts/validate_cycle_events.py'
      - 'data_sources/housing_policy_events.json'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare market-state and turning signals
        run: python3 scripts/research_turning_signal.py
      - name: Collect R-ONE long-cycle inputs
        continue-on-error: true
        run: python3 scripts/collect_reb_long_cycle.py
      - name: Run long-cycle research pipeline
        run: |
          python3 scripts/build_long_cycle_readiness.py
          python3 scripts/validate_long_cycle_inputs.py
          python3 scripts/build_long_cycle_master.py
          python3 scripts/backtest_long_cycle_regimes.py
          python3 scripts/evaluate_buy_opportunity.py
          python3 scripts/validate_long_cycle_models.py
          python3 scripts/validate_long_cycle_score.py
          python3 scripts/validate_cycle_events.py
      - name: Persist research output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f data_sources/reb_long_cycle.json data_sources/reb_price_debug.json data_sources/reb_trade_debug.json dist/turning_signal_research.json dist/long_cycle_readiness.json dist/long_cycle_validation.json dist/long_cycle_master.json dist/long_cycle_regime_backtest.json dist/buy_opportunity_evaluation.json dist/long_cycle_model_validation.json dist/long_cycle_score_validation.json dist/long_cycle_event_validation.json
          git commit -m 'Refresh turning signal research' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
