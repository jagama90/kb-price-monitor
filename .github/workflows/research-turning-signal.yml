name: Research turning signal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_turning_signal.py'
      - 'dist/final_backtest.json'\n      - 'scripts/collect_reb_long_cycle.py'\n      - 'scripts/build_long_cycle_readiness.py'\n      - 'scripts/build_long_cycle_master.py'\n      - 'scripts/validate_long_cycle_inputs.py'\n      - 'scripts/backtest_long_cycle_regimes.py'\n      - 'data_sources/housing_policy_events.json'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare market-state and turning signals
        run: python3 scripts/research_turning_signal.py
      - name: Run long-cycle research pipeline\n        run: |\n          python3 scripts/build_long_cycle_readiness.py\n          python3 scripts/validate_long_cycle_inputs.py\n          python3 scripts/evaluate_buy_opportunity.py\n      - name: Persist research output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f dist/turning_signal_research.json dist/long_cycle_readiness.json dist/long_cycle_validation.json dist/buy_opportunity_evaluation.json
          git commit -m 'Refresh turning signal research' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
