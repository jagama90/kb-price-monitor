name: One-time KB comparable regime momentum
on:
  push:
    branches: [main]
    paths: ['.github/run-kb-regime-momentum-now']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build comparable KB momentum
        run: |
          python3 scripts/collect_kb_statusboard_live.py
          python3 scripts/build_market_snapshot.py
          python3 scripts/build_regime_reference_examples.py
          python3 scripts/forecast_market_regime.py
          cp data_sources/kb_weekly_sale_index.json /tmp/kb_weekly_sale_index.json
          cp data_sources/kb_weekly_rent_index.json /tmp/kb_weekly_rent_index.json
          cp data_sources/kb_statusboard_live.json /tmp/kb_statusboard_live.json
          cp dist/market_indicators.json /tmp/market_indicators.json
          cp dist/regime_reference_examples.json /tmp/regime_reference_examples.json
          cp dist/regime_forecast.json /tmp/regime_forecast.json
      - name: Publish refreshed momentum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git pull --ff-only origin main
          cp /tmp/kb_weekly_sale_index.json data_sources/kb_weekly_sale_index.json
          cp /tmp/kb_weekly_rent_index.json data_sources/kb_weekly_rent_index.json
          cp /tmp/kb_statusboard_live.json data_sources/kb_statusboard_live.json
          cp /tmp/market_indicators.json dist/market_indicators.json
          cp /tmp/regime_reference_examples.json dist/regime_reference_examples.json
          cp /tmp/regime_forecast.json dist/regime_forecast.json
          git add data_sources/kb_weekly_sale_index.json data_sources/kb_weekly_rent_index.json data_sources/kb_statusboard_live.json dist/market_indicators.json dist/regime_reference_examples.json dist/regime_forecast.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh comparable KB regime momentum'
          git push origin HEAD:main
