name: KB watchlist history
on:
  # Production refresh is owned by weekly-refresh.yml. Keep this only for manual diagnostics.
  workflow_dispatch:
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/collect_kb_watchlist_history.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/kb_watchlist_history.json
          git commit -m 'Refresh KB watchlist history' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
