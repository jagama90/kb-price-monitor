name: Deploy website

on:
  push:
    branches: [main]
    paths: ['dist/**', 'data/buy_watchlist_master.json', 'data/buy_watchlist_targets.json', 'data/buy_watchlist_market.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync purchase watchlist data
        run: |
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
          cp data/buy_watchlist_targets.json dist/buy_watchlist_targets.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
