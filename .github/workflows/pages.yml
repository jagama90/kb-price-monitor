name: Deploy website

on:
  workflow_run:
    workflows: ['Parallel market data refresh', 'Weekly KB price refresh', 'Forward regime forecast', 'Validate market extensions']
    types: [completed]
  push:
    branches: [main]
    paths: ['dist/**', 'data/buy_watchlist_master.json', 'data/buy_watchlist_targets.json', 'data/buy_watchlist_market.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync purchase watchlist data
        run: |
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
          cp data/buy_watchlist_targets.json dist/buy_watchlist_targets.json
      - name: Validate dashboard and pipeline health
        run: |
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_pipeline_health.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
