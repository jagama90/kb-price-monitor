name: Deploy website

on:
  workflow_run:
    workflows: ['System health audit']
    types: [completed]
  push:
    branches: [main]
    # Static UI changes may deploy directly, but generated JSON waits for the
    # final System health gate so mixed-generation datasets are never published.
    paths:
      - 'dist/*.html'
      - 'dist/*.js'
      - 'dist/*.css'
      - 'scripts/test_market_judgment_engine.py'
      - 'scripts/test_engine_feature_research.py'
      - 'scripts/test_market_interpretation.py'
      - 'scripts/build_market_interpretation.py'
      - 'scripts/build_market_strength_index.py'
      - 'scripts/test_market_strength_index.py'
      - 'scripts/build_upside_probability_engine.py'
      - 'scripts/test_upside_probability_engine.py'
      - 'scripts/test_upside_probability_history.py'
      - 'scripts/record_upside_probability_history.py'
      - 'scripts/test_probability_tracking_bundle.py'
      - 'scripts/check_dashboard_bundle.py'
      - 'scripts/check_pipeline_health.py'
      - 'scripts/check_render_safety.py'
      - 'scripts/prepare_pages.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/upside-prospective-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages and manual dashboard finalization publish the same environment.
  # Serialize their deploys; never cancel a running publication.
  group: pages-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync purchase watchlist data
        run: |
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
          cp data/buy_watchlist_targets.json dist/buy_watchlist_targets.json
      - name: Validate dashboard and pipeline health
        run: |
          python3 scripts/test_engine_feature_research.py
          python3 scripts/test_market_judgment_engine.py
          python3 scripts/test_market_interpretation.py
          python3 scripts/test_market_strength_index.py
          python3 scripts/build_upside_probability_engine.py
          python3 scripts/test_upside_probability_engine.py
          python3 scripts/test_upside_prospective_evaluation.py
          python3 scripts/test_upside_probability_history.py
          python3 scripts/test_probability_tracking_bundle.py
          node --check dist/probability-tracker.js
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_render_safety.py
          python3 scripts/check_pipeline_health.py --allow-aux-stale
      - name: Prepare deploy artifact with automatic cache version
        run: |
          python3 scripts/prepare_pages.py --source dist --output site --version "$GITHUB_SHA"
          v="$(printf '%s' "$GITHUB_SHA" | cut -c1-16)"
          test -f "site/market.$v.html"
          grep -q "market.$v.html" site/index.html
          grep -q "market.$v.html" site/market.html
          grep -q "id=\"rawIntegrated\"" "site/market.$v.html"
          grep -q "id=\"probabilityResearch\"" "site/market.$v.html"
          grep -q "id=\"probabilityForecast\"" "site/market.$v.html"
          grep -q "probability-tracker.js?v=$v" "site/market.$v.html"
          grep -q "probability-tracker.css?v=$v" "site/market.$v.html"
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
