name: Manual validation and raw-source refresh

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: manual-validation-raw-refresh
  cancel-in-progress: true

jobs:
  refresh_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Freshness gate
        id: fresh
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,json,pathlib
          R=pathlib.Path('.')
          now=datetime.datetime.now(datetime.timezone.utc)
          def parse(v):
              if not v:return None
              try:return datetime.datetime.fromisoformat(str(v).replace('Z','+00:00'))
              except:return None
          def recent(path, keys, hours=6):
              try:d=json.load(open(path,encoding='utf-8'))
              except:return False
              stamp=None
              for k in keys:
                  stamp=parse(d.get(k))
                  if stamp:break
              return bool(stamp and (now-stamp).total_seconds() <= hours*3600)
          weekly=recent('data_sources/reb_weekly.json',['collected_at'])
          cross=recent('data_sources/reb_crosscheck.json',['collected_at'])
          breadth=recent('data_sources/kb_regional_breadth.json',['generated_at','collected_at'])
          print('weekly_due='+str(not weekly).lower())
          print('cross_due='+str(not cross).lower())
          print('breadth_due='+str(not breadth).lower())
          print('all_fresh='+str(weekly and cross and breadth).lower())
          PY

      - name: Install REB weekly collector
        if: steps.fresh.outputs.weekly_due == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright openpyxl
          python -m playwright install chromium

      - name: Refresh due validation sources in parallel
        if: steps.fresh.outputs.all_fresh != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          labels=()
          if [ "${{ steps.fresh.outputs.weekly_due }}" = "true" ]; then
            python3 scripts/collect_reb_weekly.py > /tmp/reb-weekly.log 2>&1 & pids+=("$!"); labels+=("REB weekly")
          fi
          if [ "${{ steps.fresh.outputs.cross_due }}" = "true" ]; then
            python3 scripts/collect_reb_crosscheck.py > /tmp/reb-cross.log 2>&1 & pids+=("$!"); labels+=("REB crosscheck")
          fi
          if [ "${{ steps.fresh.outputs.breadth_due }}" = "true" ]; then
            python3 scripts/collect_kb_regional_breadth.py > /tmp/kb-breadth.log 2>&1 & pids+=("$!"); labels+=("KB breadth")
          fi
          failed=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "${labels[$i]}: success"
            else
              echo "::error::${labels[$i]} failed"
              failed=1
            fi
          done
          for f in /tmp/reb-weekly.log /tmp/reb-cross.log /tmp/kb-breadth.log; do [ -f "$f" ] && { echo "== $f =="; tail -40 "$f"; }; done
          exit "$failed"

      - name: Recalculate validation from cached history
        run: |
          set -euo pipefail
          python3 scripts/build_market_snapshot.py
          python3 scripts/build_affordability_engine.py
          python3 scripts/build_regional_temperature.py
          python3 scripts/validate_market_extensions.py
          python3 scripts/build_market_extensions_summary.py
          python3 scripts/final_backtest.py
          python3 scripts/build_market_judgment.py
          python3 scripts/validate_market_judgment.py
          python3 scripts/forecast_market_regime.py

      - name: Validate dashboard and pipeline
        run: |
          set -euo pipefail
          node --check dist/market.js
          python3 scripts/test_market_judgment_engine.py
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_render_safety.py
          python3 scripts/check_pipeline_health.py

      - name: Rebase, rebuild and persist validation outputs
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/manual-validation/data_sources
          for f in reb_weekly.json reb_crosscheck.json kb_regional_breadth.json; do
            cp "data_sources/$f" "/tmp/manual-validation/data_sources/$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git clean -fd
          git pull --ff-only origin main
          cp /tmp/manual-validation/data_sources/*.json data_sources/
          python3 scripts/build_market_snapshot.py
          python3 scripts/build_affordability_engine.py
          python3 scripts/build_regional_temperature.py
          python3 scripts/validate_market_extensions.py
          python3 scripts/build_market_extensions_summary.py
          python3 scripts/final_backtest.py
          python3 scripts/build_market_judgment.py
          python3 scripts/validate_market_judgment.py
          python3 scripts/forecast_market_regime.py
          node --check dist/market.js
          python3 scripts/test_market_judgment_engine.py
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_render_safety.py
          python3 scripts/check_pipeline_health.py
          files="data_sources/reb_weekly.json data_sources/reb_crosscheck.json data_sources/kb_regional_breadth.json dist/market_indicators.json dist/affordability_engine.json dist/regional_temperature_history.json dist/market_extension_validation.json dist/market_extensions.json dist/final_backtest.json dist/market_judgment_candidate.json dist/market_judgment_validation.json dist/market_judgment.json dist/regime_forecast.json"
          git add -f $files
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No validation/raw-source changes."
          else
            git commit -m 'Refresh validation and raw sources'
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy refreshed dashboard
        if: steps.persist.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages.yml --ref main
          for _ in $(seq 1 30); do
            id="$(gh run list --workflow pages.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '.[] | select(.createdAt >= "'"$start"'") | .databaseId' | head -n1)"
            [ -n "$id" ] && break
            sleep 3
          done
          test -n "${id:-}"
          gh run watch "$id" --exit-status
