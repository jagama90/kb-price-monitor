name: Validate unified market judgment
on:
  workflow_run:
    workflows: ['Engine feature validation']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-validate-market-judgment'
permissions:
  contents: write
concurrency:
  group: validate-unified-market-judgment
  cancel-in-progress: true
jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit-test validated unified engine
        run: |
          python3 scripts/test_engine_feature_research.py
          python3 scripts/test_market_judgment_engine.py
      - name: Build unified candidate
        run: python3 scripts/build_market_judgment.py
      - name: Validate candidate
        run: python3 scripts/validate_market_judgment.py
      - name: Persist research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/market_judgment_candidate.json dist/market_judgment_validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validate unified market judgment'
          git pull --rebase origin main
          git push origin HEAD:main
