name: Validate unified market judgment
on:
  push:
    branches: [main]
    paths: ['.github/run-validate-market-judgment']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build unified candidate
        run: python3 scripts/build_market_judgment.py
      - name: Validate candidate
        run: python3 scripts/validate_market_judgment.py
      - name: Persist research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/market_judgment_candidate.json dist/market_judgment_validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validate unified market judgment'
          git pull --rebase origin main
          git push origin HEAD:main
