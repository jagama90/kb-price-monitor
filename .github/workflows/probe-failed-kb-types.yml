name: Probe failed KB type controls
on:
  push:
    branches: [main]
    paths: ['.github/probe-kb-types-now']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: playwright install chromium
      - name: Inspect failed type controls
        shell: bash
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          tests=[(1960,'가락금호'),(46734,'송파시그니처롯데캐슬'),(2538,'남산타운')]
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True);p=b.new_page(locale='ko-KR');p.set_default_timeout(4000)
            for cid,name in tests:
              print('\n###',cid,name)
              p.goto(f'https://kbland.kr/se/c/{cid}',wait_until='domcontentloaded',timeout=20000);p.wait_for_timeout(1800)
              vals=[]
              for i in range(p.get_by_role('button').count()):
                try:
                  el=p.get_by_role('button').nth(i)
                  t=' '.join((el.inner_text() or '').split())
                  if t and ('평' in t or 'm²' in t or '㎡' in t): vals.append(('V' if el.is_visible() else 'H')+':'+t)
                except: pass
              print('BUTTONS',vals[:120])
              desired={1960:'81Am²',46734:'85Bm²',2538:'85m²'}[cid]
              try:
                loc=p.get_by_text(desired,exact=True)
                print('DESIRED_COUNT',desired,loc.count())
                for z in range(loc.count()-1,-1,-1):
                  if loc.nth(z).is_visible():
                    loc.nth(z).click(force=True,timeout=2500);p.wait_for_timeout(1000);break
                top=[x.strip() for x in p.locator('body').inner_text().splitlines() if x.strip()]
                ix=top.index('KB시세 일반가') if 'KB시세 일반가' in top else -1
                print('AFTER_CLICK',desired,top[max(0,ix-2):ix+5])
              except Exception as e: print('CLICK_ERR',desired,repr(e))
              lines=[x.strip() for x in p.locator('body').inner_text().splitlines() if x.strip()]
              for i,x in enumerate(lines):
                if x in ('매물평균가','KB시세 일반가','최근 실거래가') or 'm²' in x or '㎡' in x:
                  print('BODY',i,lines[max(0,i-3):min(len(lines),i+6)])
            b.close()
          PY
