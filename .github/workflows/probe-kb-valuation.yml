name: Probe KB valuation sources
on:
  push:
    branches: [main]
    paths: ['.github/run-probe-kb-valuation']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe KB PIR rent ratio and price endpoints
        run: python3 scripts/collect_kb_datahub_batch.py
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data_sources/kb_datahub_batch.json
          git diff --cached --quiet && exit 0
          git commit -m 'Probe KB valuation sources'
          git pull --rebase origin main
          git push origin HEAD:main
