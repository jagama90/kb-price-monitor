name: Manual market refresh pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: manual-market-refresh-v2
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      requested_at: ${{ steps.check.outputs.requested_at }}
    steps:
      - uses: actions/checkout@v7
      - name: Check dashboard refresh queue
        id: check
        env:
          REFRESH_QUEUE_URL: https://iefzffwydvqnleukmljj.supabase.co/functions/v1/manual-market-refresh
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          out = os.environ["GITHUB_OUTPUT"]
          should = False
          requested_at = ""

          try:
              req = urllib.request.Request(
                  os.environ["REFRESH_QUEUE_URL"],
                  headers={"User-Agent":"kb-price-monitor-actions/1.0"}
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  queue = json.load(r)
              latest = queue.get("latest") or {}
              requested_at = str(latest.get("requested_at") or "")
          except Exception as e:
              print({"queue_error": repr(e)})
              requested_at = ""

          try:
              market = json.loads(Path("dist/market_indicators.json").read_text(encoding="utf-8"))
              refreshed_at = str((market.get("refresh_run") or {}).get("attempted_at") or market.get("updated_at") or "")
          except Exception:
              refreshed_at = ""

          def dt(v):
              if not v:
                  return None
              try:
                  return datetime.fromisoformat(v.replace("Z","+00:00"))
              except Exception:
                  return None

          rq, rf = dt(requested_at), dt(refreshed_at)
          should = bool(rq and (not rf or rq > rf))
          with open(out,"a",encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should else 'false'}\n")
              fh.write(f"requested_at={requested_at}\n")
          print({"requested_at":requested_at,"last_refresh":refreshed_at,"should_run":should})
          PY

  refresh:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/parallel-market-refresh.yml
    with:
      dry_run: false
    secrets: inherit


  finalize:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebuild judgment and forecast from refreshed inputs
        run: |
          python3 scripts/test_market_judgment_engine.py
          python3 scripts/build_market_judgment.py
          python3 scripts/validate_market_judgment.py
          python3 - <<'PY'
          import json
          v=json.load(open('dist/market_judgment_validation.json'))
          assert v.get('apply_recommended') is True, 'validation gate rejected unified judgment'
          assert v.get('no_future_leakage') is True, 'future-leakage guard failed'
          PY
          python3 scripts/forecast_market_regime.py
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
          cp data/buy_watchlist_targets.json dist/buy_watchlist_targets.json
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_pipeline_health.py
      - name: Persist derived outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/market_judgment_candidate.json dist/market_judgment_validation.json dist/market_judgment.json dist/regime_forecast.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh judgment after manual market update'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v5
