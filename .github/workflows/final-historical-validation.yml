name: Final historical validation
on:
  workflow_dispatch:
  push:
    paths: ['scripts/run_final_historical_validation.py','.github/workflows/final-historical-validation.yml']
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/collect_garak_geumho_24a.py
      - run: python3 scripts/run_final_historical_validation.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/garak_geumho_24a_history.json dist/final_historical_validation.json dist/condition_index_history.json
          git commit -m 'Refresh final historical validation' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
