name: System health audit
on:
  schedule:
    - cron: '15 0 * * *' # 09:15 KST, after daily market refresh + DB sync
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/system-health.yml'
      - '.github/workflows/parallel-market-refresh.yml'
      - '.github/workflows/weekly-refresh.yml'
      - '.github/workflows/final-backtest.yml'
      - '.github/workflows/research-turning-signal.yml'
      - '.github/workflows/forecast-regime.yml'
      - '.github/workflows/pages.yml'
      - 'scripts/check_dashboard_bundle.py'
      - 'scripts/check_pipeline_health.py'
permissions:
  contents: read
concurrency:
  group: system-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static dashboard checks
        run: |
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
      - name: Cross-pipeline consistency checks
        run: python3 scripts/check_pipeline_health.py
