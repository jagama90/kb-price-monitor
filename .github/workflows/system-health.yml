name: System health audit
# Single final gate for daily/weekly/monthly pipelines. No duplicate scheduled or code-push audits.
on:
  workflow_run:
    workflows: ['Forward regime forecast', 'Validate market extensions']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/system-health.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static dashboard checks
        run: |
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
      - name: Cross-pipeline consistency checks
        run: python3 scripts/check_pipeline_health.py
