name: Weekly KB price refresh

on:
  schedule:
    - cron: '5 12 * * 5' # Friday 21:05 KST
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weekly-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KB_TARGET_DISTRICTS: 강남구,서초구,송파구,성동구,광진구,중구
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect fresh KB data
        run: |
          python3 scripts/collect_seoul.py
          python3 scripts/build_buy_watchlist_master.py
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
      - name: Validate snapshot
        run: |
          node scripts/test_price_core.cjs data/seoul_types.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/seoul_snapshot.json data/seoul_snapshot.csv data/seoul_types.json data/price_changes.json data/buy_watchlist_master.json data/buy_watchlist_types.json dist/seoul_types.json dist/buy_watchlist_master.json
          git commit -m 'Weekly KB snapshot refresh' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-refresh-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/seoul_snapshot.json
            data/seoul_snapshot.csv
            data/seoul_types.json
            data/price_changes.json
            data/buy_watchlist_master.json
            data/buy_watchlist_types.json
            dist/seoul_types.json
            dist/buy_watchlist_master.json
