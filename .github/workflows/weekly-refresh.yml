name: Weekly KB price refresh

on:
  schedule:
    - cron: '5 12 * * 5' # Friday 21:05 KST
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weekly-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KB_TARGET_DISTRICTS: 강남구,서초구,송파구,성동구,광진구,중구
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe KB listing endpoint
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          payload={"단지기본일련번호":1947,"물건식별자":"KBM002217","이미지디렉토리":2217,"단지명":"가락쌍용(1차)","매물종별구분":"01","매물종별구분명":"아파트","재건축여부":"0","도시형생활주택여부":"0","준공년월":"1997.03","준공년수":30,"총세대수":2064,"총동수":14,"최소전용면적":"59.92","최대전용면적":"84.69","최소공급면적":"81.21","최대공급면적":"110.67","최소전용면적평":"18.1","최대전용면적평":"25.6","최소공급면적평":"24","최대공급면적평":"33","최소계약면적":"94.75","최대계약면적":"129.80","최소계약면적평":"28","최대계약면적평":"39","최소매매일반거래가":189500,"최대매매일반거래가":217500,"최소전세일반거래가":74500,"최대전세일반거래가":86500,"매매건수":410,"전세건수":51,"월세건수":30,"시세여부":"Y","시세노출사용여부":"Y","관심단지여부":"1","단지알림수신여부":"0","wgs84경도":"127.1276237","wgs84위도":"37.4956217","호실정보존재여부":"1","시군구명":"송파구","법정동명":"가락동","관심등록수":356,"50세대미만여부":"0","AI시세여부":"0","단지AI시세여부":"0","viewCount":81,"입주년월":"199611","등수":2,"이미지파일명":"MjIxNzEwMDI4NTQ1NDA=.jpg","이미지파일명_800":"MjIxNzEwMDI4NTQ1NzI=.jpg","이미지파일명_1920":"MjIxNzEwMDI4NTQ1MzE=.jpg","컨텐츠경로":"/kbstar/land/img/alian/kms/complex/photo/objctidnfr/2217/","이미지도메인URL":"https://file.kbland.kr/image","전자계약가능개수":"0","페이지번호":1,"페이지목록수":10,"중복타입":"02","정렬타입":"priceA","매물거래구분":"1","면적일련번호":"1835","전자계약여부":"0","비대면대출여부":"0","클린주택여부":"0","honeyYn":"0","건물동명":""}
          req=urllib.request.Request('https://api.kbland.kr/land-property/propList/main',data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),method='POST',headers={'Accept':'application/json, text/plain, */*','Content-Type':'application/json','Origin':'https://kbland.kr','Referer':'https://kbland.kr/','User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode('utf-8','replace')
                  print('PROBE_STATUS',r.status)
                  print('PROBE_BODY',body[:12000])
          except urllib.error.HTTPError as e:
              print('PROBE_STATUS',e.code)
              print('PROBE_BODY',e.read().decode('utf-8','replace')[:12000])
              raise
          PY
      - name: Collect fresh KB data
        run: |
          python3 scripts/collect_seoul.py
          python3 scripts/build_buy_watchlist_master.py
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
      - name: Validate snapshot
        run: |
          node scripts/test_price_core.cjs data/seoul_types.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/seoul_snapshot.json data/seoul_snapshot.csv data/seoul_types.json data/price_changes.json data/buy_watchlist_master.json data/buy_watchlist_types.json dist/seoul_types.json dist/buy_watchlist_master.json
          git commit -m 'Weekly KB snapshot refresh' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-refresh-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/seoul_snapshot.json
            data/seoul_snapshot.csv
            data/seoul_types.json
            data/price_changes.json
            data/buy_watchlist_master.json
            data/buy_watchlist_types.json
            dist/seoul_types.json
            dist/buy_watchlist_master.json
