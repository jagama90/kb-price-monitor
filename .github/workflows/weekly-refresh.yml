name: Weekly KB price refresh

on:
  schedule:
    - cron: '5 12 * * 5' # Friday 21:05 KST full KB checkpoint
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weekly-refresh.yml'
      - 'scripts/test_static_contract.py'
      - 'scripts/test_price_core.cjs'
      - 'scripts/collect_public_market.py'
      - 'scripts/collect_seoul.py'
      - 'scripts/build_buy_watchlist_master.py'
      - 'scripts/build_kb_value_sample.py'
      - 'scripts/probe_kb_history_endpoint.py'

permissions:
  contents: write

concurrency:
  group: kb-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
      BOK_ECOS_KEY: ${{ secrets.BOK_ECOS_KEY }}
      KB_TARGET_DISTRICTS: 강남구,서초구,송파구,성동구,광진구,중구
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect fresh KB data
        run: |
          pip install playwright
          playwright install chromium
          python3 scripts/collect_seoul.py
          python3 scripts/build_buy_watchlist_master.py
          python3 scripts/build_kb_value_sample.py
          cp data_sources/kb_value_sample.json dist/kb_value_sample.json
          cp data/buy_watchlist_market.json /tmp/buy_watchlist_market.prev.json 2>/dev/null || true
          cp dist/buy_watchlist_market.json /tmp/dist_buy_watchlist_market.prev.json 2>/dev/null || true
          if python3 scripts/collect_public_market.py; then
            echo 'KB public-market enrichment refreshed'
          else
            echo 'KB public-market enrichment failed; restoring last-good market snapshot'
            [ -f /tmp/buy_watchlist_market.prev.json ] && cp /tmp/buy_watchlist_market.prev.json data/buy_watchlist_market.json
            [ -f /tmp/dist_buy_watchlist_market.prev.json ] && cp /tmp/dist_buy_watchlist_market.prev.json dist/buy_watchlist_market.json
          fi
          python3 scripts/collect_kb_watchlist_history.py || echo 'KB watchlist history refresh failed; keeping last-good history'
          python3 scripts/collect_garak_geumho_24a.py || echo 'Garak Geumho history refresh failed; keeping last-good history'
          cp data/buy_watchlist_master.json dist/buy_watchlist_master.json
      - name: Probe official KB history endpoint
        run: python3 scripts/probe_kb_history_endpoint.py
      - name: Validate snapshot
        run: |
          node scripts/test_price_core.cjs data/seoul_types.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files="data/seoul_snapshot.json data/seoul_snapshot.csv data/seoul_types.json data/price_changes.json data/buy_watchlist_master.json data/buy_watchlist_types.json data/buy_watchlist_market.json dist/seoul_types.json dist/buy_watchlist_master.json dist/buy_watchlist_market.json dist/kb_watchlist_history.json dist/garak_geumho_24a_history.json data_sources/kb_history_status.json data_sources/kb_history_probe.json data_sources/kb_value_sample.json dist/kb_value_sample.json"
          mkdir -p /tmp/kb-weekly
          tar -cf /tmp/kb-weekly/output.tar $files
          git reset --hard
          git pull --ff-only origin main
          tar -xf /tmp/kb-weekly/output.tar -C .
          git add -f $files
          git diff --cached --quiet && exit 0
          git commit -m 'Weekly KB snapshot refresh'
          git push origin HEAD:main
      - name: Preserve refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-refresh-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/seoul_snapshot.json
            data/seoul_types.json
            data/buy_watchlist_master.json
            data/buy_watchlist_market.json
            dist/buy_watchlist_market.json
            dist/kb_watchlist_history.json
            dist/garak_geumho_24a_history.json
            data_sources/kb_history_probe.json
            data_sources/kb_value_sample.json
            dist/buy_watchlist_master.json
            dist/kb_value_sample.json
