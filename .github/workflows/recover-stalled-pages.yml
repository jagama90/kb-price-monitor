name: Recover stalled Pages publication

# Targeted recovery for a Pages deployment whose workflow completed but
# whose Pages service still reports an in-progress deployment.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stalled-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write

concurrency:
  group: pages-stalled-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify and cancel only the known stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="4e82db37de689b86bfb2c03d013e146b18468480"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$target"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code="$(curl -sS -o /tmp/pages-status.json -w '%{http_code}' "${headers[@]}" "$url")"
          if [ "$code" = "404" ]; then
            echo "Former deployment is no longer present; no cancellation necessary."
          elif [ "$code" = "200" ]; then
            state="$(jq -r '.status // "unknown"' /tmp/pages-status.json)"
            echo "Former Pages deployment status: $state"
            if [ "$state" = "in_progress" ] || [ "$state" = "queued" ] || [ "$state" = "pending" ]; then
              code="$(curl -sS -o /tmp/pages-cancel.json -w '%{http_code}' -X POST "${headers[@]}" "$url/cancel")"
              if [ "$code" != "204" ]; then
                echo "::error::Pages cancel failed with HTTP $code"
                cat /tmp/pages-cancel.json
                exit 1
              fi
              echo "Requested cancellation of the stuck Pages deployment."
              for attempt in $(seq 1 12); do
                sleep 5
                code="$(curl -sS -o /tmp/pages-status.json -w '%{http_code}' "${headers[@]}" "$url")"
                if [ "$code" = "404" ]; then break; fi
                if [ "$code" != "200" ]; then echo "::error::Pages status check HTTP $code"; exit 1; fi
                state="$(jq -r '.status // "unknown"' /tmp/pages-status.json)"
                echo "Pages recovery poll $attempt: $state"
                if [ "$state" != "in_progress" ] && [ "$state" != "queued" ] && [ "$state" != "pending" ]; then break; fi
              done
              if [ "$code" = "200" ] && { [ "$state" = "in_progress" ] || [ "$state" = "queued" ] || [ "$state" = "pending" ]; }; then
                echo "::error::Deployment still active; do not launch another colliding deploy."
                exit 1
              fi
            fi
          else
            echo "::error::Unexpected deployment query HTTP $code"
            cat /tmp/pages-status.json
            exit 1
          fi
      - name: Dispatch a fresh Pages run on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pages-dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "$code" != "204" ]; then
            echo "::error::Pages workflow dispatch returned $code"
            cat /tmp/pages-dispatch.json
            exit 1
          fi
          echo 'Fresh Pages workflow dispatched after stalled deployment recovery.'
