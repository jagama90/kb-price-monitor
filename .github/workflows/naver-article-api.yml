name: Naver Article API smoke
on:
  workflow_dispatch:
    inputs:
      naver_complex_no:
        description: "Naver complexNo"
        required: true
      kb_complex_id:
        description: "KB complex id"
        required: false
        default: "1947"
      publish:
        description: "Publish result"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Collect
        run: |
          args=(--naver-complex-no "${{ inputs.naver_complex_no }}" --kb-complex-id "${{ inputs.kb_complex_id }}")
          if [[ "${{ inputs.publish }}" == "true" ]]; then args+=(--publish); fi
          python scripts/collect_naver_article_api.py "${args[@]}"
      - name: Commit result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/naver_listing_asks_probe.json data/buy_watchlist_listings.json 2>/dev/null || true
          git commit -m 'Probe Naver Article API' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
