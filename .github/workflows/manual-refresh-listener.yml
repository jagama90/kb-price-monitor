name: Manual refresh listener

on:
  workflow_dispatch:
  schedule:
    # Watchdog only. A healthy listener self-renews before its token expires.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-refresh-listener.yml'

permissions:
  actions: write
  contents: read

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      REFRESH_QUEUE_URL: https://iefzffwydvqnleukmljj.supabase.co/functions/v1/manual-market-refresh
      LISTENER_WORKFLOW: manual-refresh-listener.yml
      REFRESH_WORKFLOW: parallel-market-refresh.yml
    steps:
      - name: Avoid duplicate listeners
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          other_listener() {
            curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$LISTENER_WORKFLOW/runs?status=in_progress&per_page=20"             | python3 -c 'import json,sys,os; d=json.load(sys.stdin); me=int(os.environ["GITHUB_RUN_ID"]); print(next((str(x["id"]) for x in d.get("workflow_runs",[]) if int(x["id"])!=me), ""))'
          }
          other="$(other_listener)"
          if [ -n "$other" ]; then
            echo "Older listener $other is still active; wait briefly for self-renew handoff."
            sleep 12
            other="$(other_listener)"
          fi
          if [ -n "$other" ]; then
            echo "Listener $other remains active; watchdog run exits."
            echo "SKIP_LISTENER=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_LISTENER=false" >> "$GITHUB_ENV"
          fi

      - name: Listen for dashboard refresh requests
        if: env.SKIP_LISTENER != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 19800 ))
          echo "Manual refresh listener active; queue poll interval is 8 seconds."

          while [ "$(date +%s)" -lt "$deadline" ]; do
            queue="$(curl -fsS --max-time 12 "$REFRESH_QUEUE_URL" 2>/dev/null || true)"
            pending="$(printf '%s' "$queue" | python3 -c 'import json,sys; 
try:
 d=json.load(sys.stdin); print(int(d.get("pending_count") or 0))
except Exception:
 print(0)' 2>/dev/null || echo 0)"

            if [ "$pending" -gt 0 ]; then
              claim_payload="$(python3 - <<'PY'
import json,os
print(json.dumps({
  "action":"claim",
  "run_id":os.environ["GITHUB_RUN_ID"],
  "github_token":os.environ["GH_TOKEN"],
}))
PY
)"
              claim="$(curl -fsS --max-time 20 -X POST                 -H 'Content-Type: application/json'                 --data-binary "$claim_payload"                 "$REFRESH_QUEUE_URL" 2>/dev/null || true)"

              claimed="$(printf '%s' "$claim" | python3 -c 'import json,sys;
try:
 d=json.load(sys.stdin); print("true" if d.get("claimed") else "false")
except Exception:
 print("false")' 2>/dev/null || echo false)"

              if [ "$claimed" = "true" ]; then
                request_id="$(printf '%s' "$claim" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("request") or {}).get("id",""))')"
                echo "Claimed manual refresh request $request_id; dispatching data pipeline now."

                http_code="$(curl -sS -o /tmp/manual-refresh-dispatch.out -w '%{http_code}'                   -X POST                   -H "Authorization: Bearer $GH_TOKEN"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   -H 'Content-Type: application/json'                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$REFRESH_WORKFLOW/dispatches"                   -d '{"ref":"main","inputs":{"dry_run":"false"}}')"

                if [ "$http_code" = "204" ]; then
                  echo "Refresh pipeline dispatched successfully for request $request_id."
                else
                  echo "::warning::Refresh dispatch failed with HTTP $http_code; releasing request $request_id."
                  release_payload="$(python3 - <<PY
import json,os
print(json.dumps({
  "action":"release",
  "run_id":os.environ["GITHUB_RUN_ID"],
  "github_token":os.environ["GH_TOKEN"],
  "request_id":int("$request_id"),
}))
PY
)"
                  curl -fsS --max-time 20 -X POST                     -H 'Content-Type: application/json'                     --data-binary "$release_payload"                     "$REFRESH_QUEUE_URL" >/dev/null || true
                fi
              fi
            fi

            sleep 8
          done

      - name: Hand off to successor listener
        if: env.SKIP_LISTENER != 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Self-renewing manual refresh listener."
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H 'Content-Type: application/json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$LISTENER_WORKFLOW/dispatches"             -d '{"ref":"main"}' >/dev/null
