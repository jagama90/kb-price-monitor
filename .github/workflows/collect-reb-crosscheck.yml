name: Collect REB crosscheck
on:
  schedule:
    - cron: '20 23 4 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_reb_crosscheck.py'
      - '.github/workflows/collect-reb-crosscheck.yml'
permissions:
  contents: write
concurrency:
  group: reb-official-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect live REB sale/rent cross-check
        run: |
          test -n "$RONE_API_KEY"
          python3 scripts/collect_reb_crosscheck.py
      - name: Validate live source payload
        run: |
          python3 - <<'PY'
          import datetime,json
          p=json.load(open('data_sources/reb_crosscheck.json',encoding='utf-8'))
          assert p.get('status')=='connected'
          assert p.get('source')=='한국부동산원 R-ONE'
          assert p.get('frequency')=='monthly'
          assert len((p.get('series') or {}).get('sale') or [])>=24
          assert len((p.get('series') or {}).get('rent') or [])>=24
          latest=(p.get('latest') or {}).get('ym')
          age=(datetime.date.today().year-int(latest[:4]))*12+datetime.date.today().month-int(latest[4:6])
          assert 0 <= age <= 2
          a=p.get('accumulation') or {}
          assert a.get('sale_pct') is not None and a.get('rent_pct') is not None
          assert p.get('production_model_weight_changed') is False
          print({'latest':latest,'accumulation':a})
          PY
      - name: Rebuild dashboard adapter
        run: python3 scripts/build_market_snapshot.py
      - name: Rebuild judgment and forecast from refreshed context
        run: |
          python3 scripts/build_market_judgment.py
          python3 scripts/validate_market_judgment.py
          python3 - <<'PY'
          import json
          v=json.load(open('dist/market_judgment_validation.json'))
          assert v.get('apply_recommended') is True
          assert v.get('no_future_leakage') is True
          PY
          python3 scripts/forecast_market_regime.py
      - name: Validate dashboard and pipeline
        run: |
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_render_safety.py
          python3 scripts/check_pipeline_health.py
      - name: Persist REB cross-check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/reb-crosscheck
          cp data_sources/reb_crosscheck.json /tmp/reb-crosscheck/
          cp dist/market_indicators.json /tmp/reb-crosscheck/
          cp dist/market_judgment_candidate.json /tmp/reb-crosscheck/
          cp dist/market_judgment_validation.json /tmp/reb-crosscheck/
          cp dist/market_judgment.json /tmp/reb-crosscheck/
          cp dist/regime_forecast.json /tmp/reb-crosscheck/
          git reset --hard
          git clean -fd
          git pull --ff-only origin main
          cp /tmp/reb-crosscheck/reb_crosscheck.json data_sources/reb_crosscheck.json
          cp /tmp/reb-crosscheck/market_indicators.json dist/market_indicators.json
          cp /tmp/reb-crosscheck/market_judgment_candidate.json dist/market_judgment_candidate.json
          cp /tmp/reb-crosscheck/market_judgment_validation.json dist/market_judgment_validation.json
          cp /tmp/reb-crosscheck/market_judgment.json dist/market_judgment.json
          cp /tmp/reb-crosscheck/regime_forecast.json dist/regime_forecast.json
          git add -f data_sources/reb_crosscheck.json dist/market_indicators.json dist/market_judgment_candidate.json dist/market_judgment_validation.json dist/market_judgment.json dist/regime_forecast.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh REB sale rent crosscheck'
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
