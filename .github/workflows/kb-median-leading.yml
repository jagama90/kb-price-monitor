name: KB median and Leading50 probe
on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe_kb_median_leading.py','.github/workflows/kb-median-leading.yml']
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/probe_kb_median_leading.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data_sources/kb_median_leading_probe.json
          git commit -m 'Probe KB median and Leading50 sources' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
