name: KB history live call
on:
  workflow_dispatch:
  push:
    paths: ['scripts/call_kb_history_endpoint.py','.github/workflows/kb-history-live.yml']
permissions: {contents: write}
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/call_kb_history_endpoint.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data_sources/kb_history_live.json
          git commit -m 'Capture KB history endpoint responses' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
