name: Final historical validation
on:
  schedule:
    - cron: '20 22 2 * *' # monthly certified refresh: 07:20 KST on the 3rd
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/final_backtest.py'
      - 'scripts/collect_historical_demand.py'
      - '.github/workflows/final-backtest.yml'
permissions: {contents: write}
concurrency:
  group: final-backtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Backfill KB target history
        run: python3 scripts/collect_garak_geumho_24a.py
      - name: Collect full KB sentiment history
        run: python3 scripts/collect_kb_sentiment.py
      - name: Collect historical M2
        env:
          BOK_ECOS_KEY: ${{ secrets.BOK_ECOS_KEY }}
        run: |
          python3 scripts/collect_ecos_m2.py || {
            echo "ECOS live refresh timed out; using committed historical M2 cache"
            test -s data_sources/ecos_m2.json
          }
      - name: Backfill historical Seoul demand
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python3 scripts/collect_historical_demand.py
      - name: Run fail-closed five-component backtest
        run: python3 scripts/final_backtest.py
      - name: Persist certified validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/final_backtest.json dist/garak_geumho_24a_history.json dist/molit_historical_backtest.json dist/molit_historical_month_cache.json
          git commit -m 'Refresh certified historical validation' || true
          # Collectors may refresh other working-tree files. Keep them out of the certified commit
          # so rebase is safe, then discard that temporary stash after pushing.
          git stash push -u -m 'non-certified collector refresh' || true
          git pull --rebase origin main
          git push origin HEAD:main
          git stash drop || true
