name: Research Common Feature Layer v2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_ecos_housing_credit.py'
      - 'scripts/research_common_feature_layer_v2.py'
      - 'scripts/test_common_feature_layer_v2.py'
      - 'data_sources/molit_price_tier_history.json'
      - 'data_sources/kb_leading50_median.json'
      - 'data_sources/molit_structural_supply.json'
      - 'data_sources/watchlist_selling_pressure_history.json'
      - 'data_sources/credit_policy_regime.json'
      - 'config/market_scope.json'
      - '.github/workflows/common-feature-layer-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: common-feature-layer-v2
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOK_ECOS_KEY: ${{ secrets.BOK_ECOS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit tests
        run: python3 scripts/test_common_feature_layer_v2.py
      - name: Collect official housing credit
        run: python3 scripts/collect_ecos_housing_credit.py
      - name: Build and validate candidate feature layer
        run: |
          python3 scripts/research_common_feature_layer_v2.py
          python3 - <<'PY'
          import json
          x=json.load(open('dist/common_feature_layer_v2_validation.json'))
          assert x.get('no_future_leakage') is True
          p=json.load(open('dist/common_feature_layer_v2.json'))
          applied=bool((p.get('features',{}).get('finance_v2_candidate') or {}).get('production_applied'))
          assert applied == bool(x.get('integrated_production_replacement_recommended')), 'finance_v2 production metadata drift'
          print({'finance_v2':x.get('finance_v2',{}).get('apply_recommended'),'finance_v2_production':applied,'valuation_rate':x.get('valuation_rate_stress',{}).get('apply_recommended')})
          PY
      - name: Existing regression checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
      - name: Rebase and persist research artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data_sources/ecos_housing_credit.json /tmp/ecos_housing_credit.json
          git reset --hard
          git clean -fd
          git pull --ff-only origin main
          cp /tmp/ecos_housing_credit.json data_sources/ecos_housing_credit.json
          python3 scripts/research_common_feature_layer_v2.py
          python3 scripts/test_common_feature_layer_v2.py
          git add -f data_sources/ecos_housing_credit.json dist/common_feature_layer_v2.json dist/common_feature_layer_v2_validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validate common feature layer v2 candidates'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::artifact push raced another source commit; rebuilding after rebase (attempt $attempt)"
            git pull --rebase origin main
            cp /tmp/ecos_housing_credit.json data_sources/ecos_housing_credit.json
            python3 scripts/research_common_feature_layer_v2.py
            python3 scripts/test_common_feature_layer_v2.py
            git add -f data_sources/ecos_housing_credit.json dist/common_feature_layer_v2.json dist/common_feature_layer_v2_validation.json
            git commit --amend --no-edit
          done
          exit 1
