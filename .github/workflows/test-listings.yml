name: Test KB listing collector
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_listings.py'
      - 'data/buy_watchlist_targets.json'
      - '.github/workflows/test-listings.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact area-id collector
        env:
          KB_AUTH_TOKEN: ${{ secrets.KB_AUTH_TOKEN }}
          KB_TRACE_ID: ${{ secrets.KB_TRACE_ID }}
          KB_WMONID: ${{ secrets.KB_WMONID }}
        run: python3 scripts/collect_listings.py --complex-id 1960
      - name: Verify area-id price identity
        run: |
          python3 - <<'PY'
          import json
          probe=json.load(open('data/listing_asks_probe.json'))
          master=json.load(open('data/buy_watchlist_master.json'))
          c=next(x for x in master['items'] if x['complex_id']==1960)
          expected={int(t['area_id']):t.get('general_price_manwon') for t in c['types'] if str(t.get('type_label','')).startswith('24')}
          got={int(x['area_id']):x.get('kb_general_check_manwon') for x in probe['items']}
          assert got, 'no probe rows'
          assert got==expected, (got,expected)
          print('PASS exact area-id KB general prices',got)
          PY
      - name: Test Garak Ssangyong 24p
        env:
          KB_AUTH_TOKEN: ${{ secrets.KB_AUTH_TOKEN }}
          KB_TRACE_ID: ${{ secrets.KB_TRACE_ID }}
          KB_WMONID: ${{ secrets.KB_WMONID }}
        run: python3 scripts/collect_listings.py --complex-id 1947 --area-id 1835
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-probe
          path: data/listing_asks_probe.json
