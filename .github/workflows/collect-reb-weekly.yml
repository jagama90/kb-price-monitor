name: Collect REB weekly official
on:
  schedule:
    - cron: '30 6 * * 4' # Thu 15:30 KST after weekly publication
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_reb_weekly.py'
      - '.github/workflows/collect-reb-weekly.yml'
permissions:
  contents: write
concurrency:
  group: reb-official-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install official-workbook collector
        run: |
          python -m pip install --disable-pip-version-check playwright openpyxl
          python -m playwright install chromium
      - name: Collect exact weekly REB indices
        run: python3 scripts/collect_reb_weekly.py
      - name: Validate live weekly source
        run: |
          python3 - <<'PY'
          import datetime,json
          p=json.load(open('data_sources/reb_weekly.json',encoding='utf-8'))
          assert p.get('status')=='connected'
          assert p.get('frequency')=='weekly'
          assert p.get('collection_method')=='public_reb_timeseries_workbook'
          assert p.get('production_model_weight_changed') is False
          assert len((p.get('series') or {}).get('sale') or [])>=100
          assert len((p.get('series') or {}).get('rent') or [])>=100
          d=datetime.datetime.strptime((p.get('latest') or {}).get('date'),'%Y%m%d').date()
          assert 0 <= (datetime.date.today()-d).days <= 14
          a=p.get('accumulation') or {}
          assert a.get('sale_pct') is not None and a.get('rent_pct') is not None
          print({'latest':p.get('latest'),'accumulation':a,'workbook':p.get('workbook')})
          PY
      - name: Rebuild dashboard adapter
        run: python3 scripts/build_market_snapshot.py
      - name: Rebuild judgment and forecast from refreshed context
        run: |
          python3 scripts/build_market_judgment.py
          python3 scripts/validate_market_judgment.py
          python3 - <<'PY'
          import json
          v=json.load(open('dist/market_judgment_validation.json'))
          assert v.get('apply_recommended') is True
          assert v.get('no_future_leakage') is True
          PY
          python3 scripts/forecast_market_regime.py
          python3 scripts/build_market_interpretation.py
          python3 scripts/build_market_strength_index.py
          python3 scripts/test_market_interpretation.py
          python3 scripts/test_market_strength_index.py
      - name: Validate dashboard and pipeline
        run: |
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 scripts/check_render_safety.py
          python3 scripts/check_pipeline_health.py
      - name: Persist exact REB weekly cross-check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/reb-weekly
          cp data_sources/reb_weekly.json /tmp/reb-weekly/
          cp dist/market_indicators.json /tmp/reb-weekly/
          cp dist/market_judgment_candidate.json /tmp/reb-weekly/
          cp dist/market_judgment_validation.json /tmp/reb-weekly/
          cp dist/market_judgment.json /tmp/reb-weekly/
          cp dist/regime_forecast.json /tmp/reb-weekly/
          cp dist/market_interpretation.json /tmp/reb-weekly/
          cp dist/market_strength_index.json /tmp/reb-weekly/
          git reset --hard
          git clean -fd
          git pull --ff-only origin main
          cp /tmp/reb-weekly/reb_weekly.json data_sources/reb_weekly.json
          cp /tmp/reb-weekly/market_indicators.json dist/market_indicators.json
          cp /tmp/reb-weekly/market_judgment_candidate.json dist/market_judgment_candidate.json
          cp /tmp/reb-weekly/market_judgment_validation.json dist/market_judgment_validation.json
          cp /tmp/reb-weekly/market_judgment.json dist/market_judgment.json
          cp /tmp/reb-weekly/regime_forecast.json dist/regime_forecast.json
          cp /tmp/reb-weekly/market_interpretation.json dist/market_interpretation.json
          cp /tmp/reb-weekly/market_strength_index.json dist/market_strength_index.json
          git add -f data_sources/reb_weekly.json dist/market_indicators.json dist/market_judgment_candidate.json dist/market_judgment_validation.json dist/market_judgment.json dist/regime_forecast.json dist/market_interpretation.json dist/market_strength_index.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh exact REB weekly crosscheck'
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
