name: Parallel market data refresh
on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/parallel-market-refresh.yml'
      - 'scripts/collect_molit_trades.py'
      - 'scripts/smoke_ecos_sources.py'
      - 'scripts/sample_ecos_finance.py'
      - 'scripts/collect_kb_sentiment.py'
      - 'scripts/collect_kb_datahub_batch.py'
      - 'scripts/collect_ecos_m2.py'
      - 'scripts/build_market_snapshot.py'
      - 'scripts/test_static_contract.py'
      - 'dist/index.html'
      - 'dist/market.html'
      - 'dist/market.js'
permissions:
  contents: write
concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kb_sentiment:
    name: C · KB sentiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect KB weekly sentiment
        run: |
          python3 scripts/collect_kb_sentiment.py
          python3 scripts/collect_kb_datahub_batch.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-kb-sentiment-${{ github.run_id }}
          path: |
            data_sources/kb_sentiment.json
            data_sources/kb_datahub_batch.json
  molit:
    name: A · MOLIT trades
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect MOLIT
        id: molit_collect
        continue-on-error: true
        run: |
          test -n "$MOLIT_SERVICE_KEY"
          python3 scripts/collect_molit_trades.py
      - name: MOLIT degraded-mode notice
        if: steps.molit_collect.outcome == 'failure'
        run: echo 'MOLIT unavailable after retries; keep last-good repository snapshot.'
      - uses: actions/upload-artifact@v4
        if: steps.molit_collect.outcome == 'success'
        with:
          name: source-molit-${{ github.run_id }}
          path: |
            data_sources/molit.json
            data_sources/molit_daily_history.json
  ecos:
    name: B · BOK ECOS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOK_ECOS_KEY: ${{ secrets.BOK_ECOS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Smoke-test ECOS finance sources
        run: |
          test -n "$BOK_ECOS_KEY"
          python3 scripts/smoke_ecos_sources.py
      - name: Sample real ECOS finance values
        run: python3 scripts/sample_ecos_finance.py
      - name: Collect ECOS M2
        run: python3 scripts/collect_ecos_m2.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-ecos-${{ github.run_id }}
          path: |
            data_sources/ecos_m2.json
            data_sources/ecos_smoke.json
            data_sources/ecos_finance_sample.json
  aggregate:
    name: E · Aggregate and validate
    if: always()
    needs: [ecos, kb_sentiment]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download MOLIT artifact
        if: needs.molit.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: source-molit-${{ github.run_id }}
          path: .
      - name: Download ECOS artifact
        if: needs.ecos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: source-ecos-${{ github.run_id }}
          path: .
      - name: Compare MOLIT reporting vintages
        run: python3 scripts/compare_molit_vintages.py
      - name: Download KB sentiment artifact
        if: needs.kb_sentiment.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: source-kb-sentiment-${{ github.run_id }}
          path: data_sources
      - name: Build KB sentiment component
        if: needs.kb_sentiment.result == 'success'
        run: python3 scripts/build_kb_sentiment_score.py
      - name: Build last-good snapshot
        run: python3 scripts/build_market_snapshot.py
      - name: Build condition-index history
        run: python3 scripts/build_condition_history.py
      - name: Build index contribution and confidence audit
        run: python3 scripts/build_index_audit.py
      - name: Run condition-index validation engine
        run: python3 scripts/validate_condition_index.py
      - name: Validate dashboard contract
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/market_indicators.json
          [ -f dist/m2_history.json ] && git add -f dist/m2_history.json
          [ -f dist/condition_index_history.json ] && git add -f dist/condition_index_history.json
          [ -f dist/index_audit.json ] && git add -f dist/index_audit.json
          [ -f dist/validation_report.json ] && git add -f dist/validation_report.json
          [ -f data_sources/ecos_finance_sample.json ] && cp data_sources/ecos_finance_sample.json dist/ecos_finance_sample.json
          [ -f dist/ecos_finance_sample.json ] && git add -f dist/ecos_finance_sample.json
          [ -f data_sources/condition_index_history.json ] && git add -f data_sources/condition_index_history.json
          [ -f data_sources/molit_vintage_comparison.json ] && cp data_sources/molit_vintage_comparison.json dist/molit_vintage_comparison.json
          [ -f dist/molit_vintage_comparison.json ] && git add -f dist/molit_vintage_comparison.json
          [ -f data_sources/molit_vintage_comparison.json ] && git add -f data_sources/molit_vintage_comparison.json
          for f in data_sources/molit.json data_sources/molit_daily_history.json data_sources/ecos_m2.json data_sources/ecos_smoke.json data_sources/ecos_finance_sample.json data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json data_sources/kb_datahub_batch.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          # Do not use `git add -A` here: data_sources is intentionally ignored and
          # must stay force-added, while unrelated generated files should not dirty the rebase.
          git diff --cached --quiet && exit 0
          # Rebase BEFORE creating the generated-data commit. The old flow committed,
          # reset it, then rebased; that allowed the checked-in old snapshot to overwrite
          # the freshly generated market_indicators.json.
          git reset
          cp dist/market_indicators.json /tmp/market_indicators.json
          [ -f data_sources/kb_sentiment.json ] && cp data_sources/kb_sentiment.json /tmp/kb_sentiment.json || true
          [ -f data_sources/kb_sentiment_score.json ] && cp data_sources/kb_sentiment_score.json /tmp/kb_sentiment_score.json || true
          rm -f data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json
          git pull --rebase --autostash origin main
          cp /tmp/market_indicators.json dist/market_indicators.json
          [ -f /tmp/kb_sentiment.json ] && cp /tmp/kb_sentiment.json data_sources/kb_sentiment.json || true
          [ -f /tmp/kb_sentiment_score.json ] && cp /tmp/kb_sentiment_score.json data_sources/kb_sentiment_score.json || true
          git add -f dist/market_indicators.json
          for f in data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m 'Daily parallel market data refresh'
          git push origin HEAD:main
          exit 0
          # Rebase once before creating the generated-data commit to avoid add/add
          # conflicts when an older run overlaps a newer workflow revision.
          git reset
          # Preserve generated snapshot across the rebase; otherwise reset/autostash can restore the old dist file.
          cp dist/market_indicators.json /tmp/market_indicators.json
          [ -f data_sources/kb_sentiment_score.json ] && cp data_sources/kb_sentiment_score.json /tmp/kb_sentiment_score.json || true
          git pull --rebase --autostash origin main
          cp /tmp/market_indicators.json dist/market_indicators.json
          [ -f /tmp/kb_sentiment_score.json ] && cp /tmp/kb_sentiment_score.json data_sources/kb_sentiment_score.json || true
          git add -f dist/market_indicators.json
          [ -f dist/m2_history.json ] && git add -f dist/m2_history.json
          [ -f dist/condition_index_history.json ] && git add -f dist/condition_index_history.json
          [ -f dist/index_audit.json ] && git add -f dist/index_audit.json
          [ -f dist/validation_report.json ] && git add -f dist/validation_report.json
          [ -f data_sources/condition_index_history.json ] && git add -f data_sources/condition_index_history.json
          for f in data_sources/molit.json data_sources/molit_daily_history.json data_sources/ecos_m2.json data_sources/ecos_smoke.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet && exit 0
          git commit --amend --no-edit
          git push origin HEAD:main
