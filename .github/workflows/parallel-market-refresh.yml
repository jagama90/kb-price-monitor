name: Parallel market data refresh
# full-refresh trigger: 2026-09-28 12:54 KST
# KB detail merge enabled
# catch-up trigger: 2026-09-28 missed scheduled refresh
# FAST PATH: daily source refresh only. Code changes are validated by the sample path.
on:
  schedule:
    - cron: '5 22 * * *' # 07:05 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run full fast path without committing data'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      dry_run:
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: market-data-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kb_sentiment:
    name: C · KB sentiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_ready: ${{ steps.kb_sentiment_collect.outcome == 'success' }}
      retried: ${{ steps.kb_sentiment_collect.outputs.retried }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect KB weekly sentiment
        id: kb_sentiment_collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          collect_source() {
            set +e
            python3 scripts/collect_kb_sentiment.py & p1=$!
            python3 scripts/collect_kb_statusboard_live.py & p2=$!
            python3 scripts/collect_kb_datahub_batch.py & p3=$!
            wait "$p1"; s1=$?
            wait "$p2"; s2=$?
            wait "$p3"; s3=$?
            set -e
            [ "$s1" -eq 0 ] && [ "$s2" -eq 0 ] && [ "$s3" -eq 0 ]
          }
          echo "retried=false" >> "$GITHUB_OUTPUT"
          if ! collect_source; then
            echo "::warning::KB sentiment source failed on first attempt; retrying once in 10s"
            echo "retried=true" >> "$GITHUB_OUTPUT"
            sleep 10
            collect_source
          fi
      - uses: actions/upload-artifact@v4
        if: steps.kb_sentiment_collect.outcome == 'success'
        with:
          name: source-kb-sentiment-${{ github.run_id }}
          path: |
            data_sources/kb_sentiment.json
            data_sources/kb_statusboard_live.json
            data_sources/kb_datahub_batch.json
            data_sources/kb_weekly_sale_index.json
            data_sources/kb_weekly_rent_index.json
  molit:
    name: A · MOLIT trades
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_ready: ${{ steps.molit_collect.outcome == 'success' }}
      retried: ${{ steps.molit_collect.outputs.retried }}
    env:
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect MOLIT
        id: molit_collect
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$MOLIT_SERVICE_KEY"
          collect_source() {
            # Query the small watchlist slice first, before the Seoul-wide burst.
            python3 scripts/collect_watchlist_recent_trades.py &&
            python3 scripts/collect_molit_trades.py
          }
          echo "retried=false" >> "$GITHUB_OUTPUT"
          if ! collect_source; then
            echo "::warning::MOLIT source failed on first attempt; retrying once in 10s"
            echo "retried=true" >> "$GITHUB_OUTPUT"
            sleep 10
            collect_source
          fi
      - name: MOLIT degraded-mode notice
        if: steps.molit_collect.outcome == 'failure'
        run: echo 'MOLIT unavailable after retries; keep last-good repository snapshot.'
      - uses: actions/upload-artifact@v4
        if: steps.molit_collect.outcome == 'success'
        with:
          name: source-molit-${{ github.run_id }}
          path: |
            data_sources/molit.json
            data_sources/molit_daily_history.json
            data_sources/watchlist_recent_trades.json
  ecos:
    name: B · BOK ECOS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_ready: ${{ steps.ecos_collect.outcome == 'success' }}
      retried: ${{ steps.ecos_collect.outputs.retried }}
    env:
      BOK_ECOS_KEY: ${{ secrets.BOK_ECOS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect ECOS finance sources with retry
        id: ecos_collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOK_ECOS_KEY"
          collect_source() {
            set +e
            python3 scripts/collect_ecos_mortgage_rate.py & p1=$!
            python3 scripts/collect_ecos_base_rate.py & p2=$!
            python3 scripts/collect_ecos_m2.py & p3=$!
            wait "$p1"; s1=$?
            wait "$p2"; s2=$?
            wait "$p3"; s3=$?
            set -e
            [ "$s1" -eq 0 ] && [ "$s2" -eq 0 ] && [ "$s3" -eq 0 ]
          }
          echo "retried=false" >> "$GITHUB_OUTPUT"
          if ! collect_source; then
            echo "::warning::ECOS source failed on first attempt; retrying once in 10s"
            echo "retried=true" >> "$GITHUB_OUTPUT"
            sleep 10
            collect_source
          fi
      - uses: actions/upload-artifact@v4
        if: steps.ecos_collect.outcome == 'success'
        with:
          name: source-ecos-${{ github.run_id }}
          path: |
            data_sources/ecos_m2.json
            data_sources/ecos_smoke.json
            data_sources/ecos_finance_sample.json
            data_sources/ecos_mortgage_rate.json
            data_sources/ecos_base_rate.json
  watchlist_details:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      artifact_ready: ${{ steps.watchlist_collect.outcome == 'success' }}
      retried: ${{ steps.watchlist_collect.outputs.retried }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Collect KB watchlist detail fields
        id: watchlist_collect
        continue-on-error: true
        env:
          KB_AUTH_TOKEN: ${{ secrets.KB_AUTH_TOKEN }}
          KB_TRACE_ID: ${{ secrets.KB_TRACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "retried=false" >> "$GITHUB_OUTPUT"
          if ! python3 scripts/collect_listings.py --publish; then
            echo "::warning::KB watchlist detail source failed on first attempt; retrying once in 10s"
            echo "retried=true" >> "$GITHUB_OUTPUT"
            sleep 10
            python3 scripts/collect_listings.py --publish
          fi
      - uses: actions/upload-artifact@v4
        if: steps.watchlist_collect.outcome == 'success'
        with: {name: watchlist-details, path: data/buy_watchlist_listings.json}

  aggregate:
    name: E · Aggregate and validate
    if: always()
    needs: [molit, ecos, kb_sentiment, watchlist_details]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download MOLIT artifact
        if: needs.molit.outputs.artifact_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: source-molit-*
          merge-multiple: true
          path: data_sources
      - name: Download ECOS artifact
        if: needs.ecos.outputs.artifact_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: source-ecos-*
          merge-multiple: true
          path: data_sources
      - name: Compare MOLIT reporting vintages
        run: python3 scripts/compare_molit_vintages.py
      - name: Download KB sentiment artifact
        if: needs.kb_sentiment.outputs.artifact_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: source-kb-sentiment-*
          merge-multiple: true
          path: data_sources
      - name: Download KB watchlist detail artifact
        if: needs.watchlist_details.outputs.artifact_ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: watchlist-details
          path: data
      - name: Record source refresh outcomes
        env:
          MOLIT_ARTIFACT_READY: ${{ needs.molit.outputs.artifact_ready }}
          ECOS_ARTIFACT_READY: ${{ needs.ecos.outputs.artifact_ready }}
          KB_SENTIMENT_ARTIFACT_READY: ${{ needs.kb_sentiment.outputs.artifact_ready }}
          WATCHLIST_DETAIL_ARTIFACT_READY: ${{ needs.watchlist_details.outputs.artifact_ready }}
          MOLIT_RETRIED: ${{ needs.molit.outputs.retried }}
          ECOS_RETRIED: ${{ needs.ecos.outputs.retried }}
          KB_SENTIMENT_RETRIED: ${{ needs.kb_sentiment.outputs.retried }}
          WATCHLIST_DETAIL_RETRIED: ${{ needs.watchlist_details.outputs.retried }}
        run: |
          python3 - <<'PY'
          import json,os,datetime,pathlib
          def state(v,truth='success'):
              return 'connected' if str(v).lower()==truth else 'fallback_last_good'
          sources={
            'molit':state(os.getenv('MOLIT_ARTIFACT_READY'),'true'),
            'ecos':state(os.getenv('ECOS_ARTIFACT_READY'),'true'),
            'kb_sentiment':state(os.getenv('KB_SENTIMENT_ARTIFACT_READY'),'true'),
            'watchlist_detail':state(os.getenv('WATCHLIST_DETAIL_ARTIFACT_READY'),'true'),
          }
          retried={
            'molit':str(os.getenv('MOLIT_RETRIED')).lower()=='true',
            'ecos':str(os.getenv('ECOS_RETRIED')).lower()=='true',
            'kb_sentiment':str(os.getenv('KB_SENTIMENT_RETRIED')).lower()=='true',
            'watchlist_detail':str(os.getenv('WATCHLIST_DETAIL_RETRIED')).lower()=='true',
          }
          payload={
            'attempted_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sources':sources,
            'attempts':{k:(2 if retried[k] else 1) for k in sources},
            'recovered_after_retry':[k for k in sources if retried[k] and sources[k]=='connected'],
            'failed_after_retry':[k for k in sources if retried[k] and sources[k]!='connected'],
          }
          p=pathlib.Path('data_sources/refresh_run_status.json')
          p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False))
          PY
      - name: Build connected KB value component
        run: |
          python3 scripts/collect_garak_geumho_24a.py || echo 'KB value history refresh unavailable; using last-good history'
          python3 scripts/build_kb_value_live.py
      - name: Build KB sentiment component
        if: needs.kb_sentiment.outputs.artifact_ready == 'true'
        run: python3 scripts/build_kb_sentiment_score.py
      - name: Merge KB watchlist details
        if: needs.watchlist_details.outputs.artifact_ready == 'true'
        run: python3 scripts/merge_watchlist_details.py
      - name: Build last-good snapshot
        run: python3 scripts/build_market_snapshot.py
      - name: Build condition-index history
        run: python3 scripts/build_condition_history.py
      - name: Build index contribution and confidence audit
        run: python3 scripts/build_index_audit.py
      - name: Run condition-index validation engine
        run: python3 scripts/validate_condition_index.py
      - name: Validate dashboard contract
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit source snapshots
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/market-refresh
          cp dist/market_indicators.json /tmp/market-refresh/
          [ -f dist/garak_geumho_24a_history.json ] && cp dist/garak_geumho_24a_history.json /tmp/market-refresh/
          [ -f data/buy_watchlist_listings.json ] && cp data/buy_watchlist_listings.json /tmp/market-refresh/
          [ -f data/buy_watchlist_market.json ] && cp data/buy_watchlist_market.json /tmp/market-refresh/
          for f in dist/m2_history.json dist/condition_index_history.json dist/index_audit.json dist/validation_report.json data_sources/refresh_run_status.json data_sources/ecos_mortgage_rate.json data_sources/ecos_base_rate.json data_sources/ecos_m2.json data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json data_sources/kb_statusboard_live.json data_sources/kb_weekly_sale_index.json data_sources/kb_weekly_rent_index.json data_sources/kb_value_score.json data_sources/molit.json data_sources/molit_daily_history.json data_sources/watchlist_recent_trades.json; do
            [ -f "$f" ] && cp "$f" /tmp/market-refresh/$(basename "$f")
          done
          git reset --hard
          git clean -fd
          git pull --ff-only origin main
          cp /tmp/market-refresh/market_indicators.json dist/market_indicators.json
          [ -f /tmp/market-refresh/garak_geumho_24a_history.json ] && cp /tmp/market-refresh/garak_geumho_24a_history.json dist/garak_geumho_24a_history.json
          [ -f /tmp/market-refresh/buy_watchlist_listings.json ] && cp /tmp/market-refresh/buy_watchlist_listings.json data/buy_watchlist_listings.json
          [ -f /tmp/market-refresh/buy_watchlist_market.json ] && python3 scripts/merge_parallel_market_snapshot.py --source /tmp/market-refresh/buy_watchlist_market.json
          [ -f /tmp/market-refresh/m2_history.json ] && cp /tmp/market-refresh/m2_history.json dist/m2_history.json
          [ -f /tmp/market-refresh/condition_index_history.json ] && cp /tmp/market-refresh/condition_index_history.json dist/condition_index_history.json
          [ -f /tmp/market-refresh/index_audit.json ] && cp /tmp/market-refresh/index_audit.json dist/index_audit.json
          [ -f /tmp/market-refresh/validation_report.json ] && cp /tmp/market-refresh/validation_report.json dist/validation_report.json
          for n in refresh_run_status.json ecos_mortgage_rate.json ecos_base_rate.json ecos_m2.json kb_sentiment.json kb_sentiment_score.json kb_statusboard_live.json kb_weekly_sale_index.json kb_weekly_rent_index.json kb_value_score.json molit.json molit_daily_history.json watchlist_recent_trades.json; do
            [ -f /tmp/market-refresh/$n ] && cp /tmp/market-refresh/$n data_sources/$n
          done
          git add -f dist/market_indicators.json
          [ -f dist/garak_geumho_24a_history.json ] && git add -f dist/garak_geumho_24a_history.json
          [ -f data/buy_watchlist_listings.json ] && git add -f data/buy_watchlist_listings.json
          [ -f data/buy_watchlist_market.json ] && git add -f data/buy_watchlist_market.json
          [ -f dist/buy_watchlist_market.json ] && git add -f dist/buy_watchlist_market.json
          for f in dist/m2_history.json dist/condition_index_history.json dist/index_audit.json dist/validation_report.json; do [ -f "$f" ] && git add -f "$f"; done
          for f in data_sources/refresh_run_status.json data_sources/ecos_mortgage_rate.json data_sources/ecos_base_rate.json data_sources/ecos_m2.json data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json data_sources/kb_statusboard_live.json data_sources/kb_weekly_sale_index.json data_sources/kb_weekly_rent_index.json data_sources/kb_value_score.json data_sources/molit.json data_sources/molit_daily_history.json data_sources/watchlist_recent_trades.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m 'Daily parallel market data refresh'
          git push origin HEAD:main
