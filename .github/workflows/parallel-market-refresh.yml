name: Parallel market data refresh
# KB detail merge enabled
on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/parallel-market-refresh.yml'
      - 'scripts/collect_molit_trades.py'
      - 'scripts/smoke_ecos_sources.py'
      - 'scripts/sample_ecos_finance.py'
      - 'scripts/collect_kb_sentiment.py'
      - 'scripts/collect_kb_datahub_batch.py'
      - 'scripts/collect_garak_geumho_24a.py'
      - 'scripts/build_kb_value_live.py'
      - 'scripts/collect_ecos_m2.py'
      - 'scripts/collect_ecos_mortgage_rate.py'
      - 'scripts/build_market_snapshot.py'
      - 'scripts/collect_listings.py'
      - 'scripts/merge_watchlist_details.py'
      - 'data/buy_watchlist_targets.json'
      - 'data/buy_watchlist_master.json'
      - 'scripts/test_static_contract.py'
      - 'dist/index.html'
      - 'dist/market.html'
      - 'dist/market.js'
permissions:
  contents: write
concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kb_sentiment:
    name: C · KB sentiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect KB weekly sentiment
        run: |
          python3 scripts/collect_kb_sentiment.py
          python3 scripts/collect_kb_statusboard_live.py
          python3 scripts/parse_kb_weekly_indices.py
          python3 scripts/collect_kb_datahub_batch.py
          python3 scripts/collect_kb_weekly_sale_index.py || echo 'legacy KB page-contract collector skipped; live statusBoard data retained'
      - uses: actions/upload-artifact@v4
        with:
          name: source-kb-sentiment-${{ github.run_id }}
          path: |
            data_sources/kb_sentiment.json
            data_sources/kb_statusboard_live.json
            data_sources/kb_weekly_sale_index.json
            data_sources/kb_weekly_rent_index.json
            data_sources/kb_datahub_batch.json
            data_sources/kb_weekly_sale_index.json
  molit:
    name: A · MOLIT trades
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect MOLIT
        id: molit_collect
        continue-on-error: true
        run: |
          test -n "$MOLIT_SERVICE_KEY"
          python3 scripts/collect_molit_trades.py
      - name: MOLIT degraded-mode notice
        if: steps.molit_collect.outcome == 'failure'
        run: echo 'MOLIT unavailable after retries; keep last-good repository snapshot.'
      - uses: actions/upload-artifact@v4
        if: steps.molit_collect.outcome == 'success'
        with:
          name: source-molit-${{ github.run_id }}
          path: |
            data_sources/molit.json
            data_sources/molit_daily_history.json
  ecos:
    name: B · BOK ECOS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOK_ECOS_KEY: ${{ secrets.BOK_ECOS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect ECOS finance sources with retry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOK_ECOS_KEY"
          retry() {
            local attempt=1 max=4 delay=8
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "ECOS command failed after $attempt attempts: $*"
                return 1
              fi
              echo "ECOS transient failure; retry $((attempt+1))/$max in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt+1))
              delay=$((delay*2))
            done
          }
          retry python3 scripts/smoke_ecos_sources.py
          retry python3 scripts/sample_ecos_finance.py
          retry python3 scripts/collect_ecos_mortgage_rate.py
          retry python3 scripts/collect_ecos_m2.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-ecos-${{ github.run_id }}
          path: |
            data_sources/ecos_m2.json
            data_sources/ecos_smoke.json
            data_sources/ecos_finance_sample.json
            data_sources/ecos_mortgage_rate.json
  watchlist_details:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Collect KB watchlist detail fields
        id: watchlist_collect
        env:
          KB_AUTH_TOKEN: ${{ secrets.KB_AUTH_TOKEN }}
          KB_TRACE_ID: ${{ secrets.KB_TRACE_ID }}
        run: python3 scripts/collect_listings.py --publish
      - uses: actions/upload-artifact@v4
        if: steps.watchlist_collect.outcome == 'success'
        with: {name: watchlist-details, path: data/buy_watchlist_listings.json}

  aggregate:
    name: E · Aggregate and validate
    if: always()
    needs: [molit, ecos, kb_sentiment, watchlist_details]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download MOLIT artifact
        if: needs.molit.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: source-molit-*
          merge-multiple: true
          path: data_sources
      - name: Download ECOS artifact
        if: needs.ecos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: source-ecos-*
          merge-multiple: true
          path: data_sources
      - name: Compare MOLIT reporting vintages
        run: python3 scripts/compare_molit_vintages.py
      - name: Download KB sentiment artifact
        if: needs.kb_sentiment.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: source-kb-sentiment-*
          merge-multiple: true
          path: data_sources
      - name: Download KB watchlist detail artifact
        if: needs.watchlist_details.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: watchlist-details
          path: data
      - name: Build connected KB value component
        run: |
          python3 scripts/collect_garak_geumho_24a.py
          python3 scripts/build_kb_value_live.py
      - name: Build KB sentiment component
        if: needs.kb_sentiment.result == 'success'
        run: python3 scripts/build_kb_sentiment_score.py
      - name: Merge KB watchlist details
        if: needs.watchlist_details.result == 'success'
        run: python3 scripts/merge_watchlist_details.py
      - name: Build last-good snapshot
        run: python3 scripts/build_market_snapshot.py
      - name: Build condition-index history
        run: python3 scripts/build_condition_history.py
      - name: Build index contribution and confidence audit
        run: python3 scripts/build_index_audit.py
      - name: Run condition-index validation engine
        run: python3 scripts/validate_condition_index.py
      - name: Validate dashboard contract
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/market-refresh
          cp dist/market_indicators.json /tmp/market-refresh/
          [ -f data/buy_watchlist_listings.json ] && cp data/buy_watchlist_listings.json /tmp/market-refresh/
          [ -f data/buy_watchlist_market.json ] && cp data/buy_watchlist_market.json /tmp/market-refresh/
          [ -f dist/buy_watchlist_market.json ] && cp dist/buy_watchlist_market.json /tmp/market-refresh/dist_buy_watchlist_market.json
          for f in dist/m2_history.json dist/condition_index_history.json dist/index_audit.json dist/validation_report.json data_sources/ecos_mortgage_rate.json data_sources/ecos_m2.json data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json data_sources/kb_statusboard_live.json data_sources/kb_weekly_sale_index.json data_sources/kb_weekly_rent_index.json data_sources/kb_value_score.json data_sources/molit.json data_sources/molit_daily_history.json; do
            [ -f "$f" ] && cp "$f" /tmp/market-refresh/$(basename "$f")
          done
          git reset --hard
          git pull --rebase origin main
          cp /tmp/market-refresh/market_indicators.json dist/market_indicators.json
          [ -f /tmp/market-refresh/buy_watchlist_listings.json ] && cp /tmp/market-refresh/buy_watchlist_listings.json data/buy_watchlist_listings.json
          [ -f /tmp/market-refresh/buy_watchlist_market.json ] && cp /tmp/market-refresh/buy_watchlist_market.json data/buy_watchlist_market.json
          [ -f /tmp/market-refresh/dist_buy_watchlist_market.json ] && cp /tmp/market-refresh/dist_buy_watchlist_market.json dist/buy_watchlist_market.json
          [ -f /tmp/market-refresh/m2_history.json ] && cp /tmp/market-refresh/m2_history.json dist/m2_history.json
          [ -f /tmp/market-refresh/condition_index_history.json ] && cp /tmp/market-refresh/condition_index_history.json dist/condition_index_history.json
          [ -f /tmp/market-refresh/index_audit.json ] && cp /tmp/market-refresh/index_audit.json dist/index_audit.json
          [ -f /tmp/market-refresh/validation_report.json ] && cp /tmp/market-refresh/validation_report.json dist/validation_report.json
          for n in ecos_mortgage_rate.json ecos_m2.json kb_sentiment.json kb_sentiment_score.json kb_statusboard_live.json kb_weekly_sale_index.json kb_weekly_rent_index.json kb_value_score.json molit.json molit_daily_history.json; do
            [ -f /tmp/market-refresh/$n ] && cp /tmp/market-refresh/$n data_sources/$n
          done
          git add -f dist/market_indicators.json
          [ -f data/buy_watchlist_listings.json ] && git add -f data/buy_watchlist_listings.json
          [ -f data/buy_watchlist_market.json ] && git add -f data/buy_watchlist_market.json
          [ -f dist/buy_watchlist_market.json ] && git add -f dist/buy_watchlist_market.json
          for f in dist/m2_history.json dist/condition_index_history.json dist/index_audit.json dist/validation_report.json; do [ -f "$f" ] && git add -f "$f"; done
          for f in data_sources/ecos_mortgage_rate.json data_sources/ecos_m2.json data_sources/kb_sentiment.json data_sources/kb_sentiment_score.json data_sources/kb_statusboard_live.json data_sources/kb_weekly_sale_index.json data_sources/kb_weekly_rent_index.json data_sources/kb_value_score.json data_sources/molit.json data_sources/molit_daily_history.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m 'Daily parallel market data refresh'
          git push origin HEAD:main
