name: Naver watchlist lowest asks
on:
  workflow_dispatch:
    inputs:
      complex_id:
        description: "KB complex id (blank = configured targets)"
        required: false
        default: "1947"
      publish:
        description: "Publish when collection has no errors"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install browser helper
        run: npm install
      - name: Collect lowest asking prices
        env:
          NAVER_BROWSER_CHANNEL: chrome
        run: |
          args=(--max-pages 4)
          if [[ -n "${{ inputs.complex_id }}" ]]; then args+=(--complex-id "${{ inputs.complex_id }}"); fi
          if [[ "${{ inputs.publish }}" == "true" ]]; then args+=(--publish); fi
          python3 scripts/collect_naver_listings.py "${args[@]}"
      - name: Commit probe/result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/naver_listing_asks_probe.json data/buy_watchlist_listings.json 2>/dev/null || true
          git commit -m 'Collect Naver watchlist lowest asks' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
