name: Naver watchlist lowest asks
on:
  schedule:
    - cron: '20 22 * * *'
  push:
    paths:
      - 'scripts/collect_naver_listings.py'
      - '.github/workflows/naver-listings.yml'
  workflow_dispatch:
    inputs:
      complex_id:
        description: "KB complex id (blank = configured targets)"
        required: false
        default: ""
      publish:
        description: "Publish when collection has no errors"
        required: false
        default: "true"
        type: choice
        options: ["false","true"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install browser helper
        run: npm install && npx playwright install --with-deps chromium
      - name: Collect lowest asking prices
        env:
          NAVER_BROWSER_CHANNEL: chromium
        run: |
          args=(--max-pages 4)
          if [[ -n "${{ inputs.complex_id }}" ]]; then args+=(--complex-id "${{ inputs.complex_id }}"); fi
          if [[ "${{ inputs.publish }}" == "true" ]]; then args+=(--publish); fi
          python3 scripts/collect_naver_listings.py "${args[@]}"
      - name: Commit probe/result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/naver_listing_asks_probe.json data/buy_watchlist_listings.json 2>/dev/null || true
          git commit -m 'Collect Naver watchlist lowest asks' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
