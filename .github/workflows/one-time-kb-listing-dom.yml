name: One-time KB listing DOM refresh
on:
  push:
    branches: [main]
    paths: ['.github/kb-listing-dom-now']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: playwright install chromium
      - name: Collect rendered KB listing metrics
        shell: bash
        run: |
          set +e
          python3 scripts/collect_public_market.py
          rc=$?
          cp data/buy_watchlist_market.json /tmp/kb-listing-dom.json
          echo "collector_rc=$rc"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/kb-listing-dom.json'))
          a=d.get('items') or []
          print({'rows':len(a),'with_avg':sum(x.get('avg_ask_manwon') is not None for x in a),'with_count':sum(x.get('sale_listing_count') is not None for x in a),'with_delta':sum(x.get('sale_listing_week_delta') is not None for x in a),'errors':len(d.get('errors') or [])})
          PY
          exit 0
      - name: Merge successful rows into newest market snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git pull --ff-only origin main
          python3 scripts/merge_weekly_listing_snapshot.py --source /tmp/kb-listing-dom.json
          git add data/buy_watchlist_market.json dist/buy_watchlist_market.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh KB watchlist listing metrics'
          git push origin HEAD:main
