name: Forward regime forecast
# Fast derived step: runs only after fresh market/research data, never on ordinary code pushes.
on:
  workflow_run:
    workflows: ['Research turning signal', 'Parallel market data refresh', 'Repair dashboard data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: forecast-regime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forecast:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build forward regime forecast
        run: python3 scripts/forecast_market_regime.py
      - name: Validate forecast bundle contract
        run: |
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 - <<'PY'
          import json
          m=json.load(open('dist/market_indicators.json'))
          f=json.load(open('dist/regime_forecast.json'))
          j=json.load(open('dist/market_judgment.json'))
          assert f.get('as_of')==m.get('updated_at'), 'forecast as_of mismatch'
          assert j.get('as_of')==m.get('updated_at'), 'judgment as_of mismatch'
          assert f.get('unified_snapshot_id')==j.get('feature_layer',{}).get('snapshot_id'), 'forecast/judgment snapshot mismatch'
          assert f.get('latest_research_month'), 'forecast research lineage missing'
          try:
              v=json.load(open('dist/forecast_kb_momentum_validation.json'))
          except FileNotFoundError:
              v={}
          km=((m.get('kb_weekly_sale_index') or {}).get('momentum') or {})
          if v.get('apply_recommended') and km.get('mom_4w_pct') is not None and km.get('mom_13w_pct') is not None:
              o=f.get('price_momentum_overlay') or {}
              assert o.get('applied') is True, 'validated KB momentum overlay was not applied'
              assert o.get('source','').startswith('KB Seoul weekly sale index'), 'unexpected price momentum source'
          print({'status':'ok','as_of':f.get('as_of'),'research':f.get('latest_research_month'),'kb_overlay':(f.get('price_momentum_overlay') or {}).get('applied')})
          PY
      - name: Rebase, rebuild and persist forecast
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git pull --ff-only origin main
          # Recompute after pull so the committed forecast always consumes the
          # newest market/research inputs rather than the workflow-start snapshot.
          python3 scripts/forecast_market_regime.py
          node --check dist/market.js
          python3 scripts/check_dashboard_bundle.py
          python3 - <<'PY'
          import json
          m=json.load(open('dist/market_indicators.json'))
          f=json.load(open('dist/regime_forecast.json'))
          j=json.load(open('dist/market_judgment.json'))
          assert f.get('as_of')==m.get('updated_at'), 'forecast as_of mismatch after pull'
          assert j.get('as_of')==m.get('updated_at'), 'judgment as_of mismatch after pull'
          assert f.get('unified_snapshot_id')==j.get('feature_layer',{}).get('snapshot_id'), 'snapshot mismatch after pull'
          try:
              v=json.load(open('dist/forecast_kb_momentum_validation.json'))
          except FileNotFoundError:
              v={}
          km=((m.get('kb_weekly_sale_index') or {}).get('momentum') or {})
          if v.get('apply_recommended') and km.get('mom_4w_pct') is not None and km.get('mom_13w_pct') is not None:
              assert (f.get('price_momentum_overlay') or {}).get('applied') is True, 'validated KB overlay missing after pull'
          PY
          git add -f dist/regime_forecast.json dist/market_judgment.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh forward regime forecast'
          git push origin HEAD:main
