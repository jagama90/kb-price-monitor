name: Daily fast-path smoke

# Diagnostic caller for the production daily workflow.
# It executes the same jobs end-to-end but skips the repository commit.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-browser-listings.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fast-smoke
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/parallel-market-refresh.yml
    with:
      dry_run: true
    secrets: inherit
